<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>天書奇談預測器｜FF14 工具箱</title><style>:root{color-scheme:dark;--bg:#100e22;--p:#211b43;--l:#e0bcff2e;--t:#fff9ff;--m:#b9accb;--g:#ffd36f;--b:#82d9ff;--x:#ff8bd4}*{box-sizing:border-box}body{margin:0;min-width:320px;color:var(--t);font:15px/1.55 Segoe UI,"Noto Sans TC",sans-serif;background:radial-gradient(circle at 8% 2%,#a156c44a,transparent 30%),linear-gradient(160deg,#100e22,#171536 60%,#0e0c1e)}main{width:min(1000px,calc(100% - 24px));margin:auto;padding:22px 0 50px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}header strong{display:block;color:var(--g);font-size:12px;letter-spacing:.13em}header b{font-size:16px}.back{color:var(--b);text-decoration:none;font-size:13px}h1{font-size:clamp(30px,6vw,52px);line-height:1.1;margin:0 0 8px}.hero{color:var(--m);margin-bottom:22px}.layout{display:grid;grid-template-columns:1fr 360px;gap:18px}.panel{padding:clamp(18px,4vw,28px);border:1px solid var(--l);border-radius:22px;background:linear-gradient(145deg,#28204deb,#151331e6);box-shadow:0 24px 80px #0005}h2{margin:0 0 7px}.help{color:var(--m);font-size:13px}.gridbox{padding:13px;border:1px solid #ffd36f33;border-radius:18px;background:#0a081b59}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:480px;margin:auto;aspect-ratio:1}.cell{border:1px solid #e0bcff38;border-radius:12px;color:#fff9ff77;background:#44346fc2;cursor:pointer;font-size:clamp(22px,5vw,38px);font-weight:800}.cell.on{color:#fff;border-color:var(--x);background:#9b4c8be0}.cell small{display:block;color:inherit;font-size:10px;font-weight:400}.bar{display:flex;justify-content:space-between;margin-top:14px;color:var(--m)}.bar b{color:var(--g);font-size:18px}.actions{display:flex;gap:8px;margin-top:14px}.btn{min-height:40px;padding:0 14px;border:1px solid var(--l);border-radius:11px;color:var(--t);background:#ffffff0d;cursor:pointer}.btn.main{border:0;color:#201531;background:linear-gradient(135deg,#ffd36f,#ff9cd9);font-weight:800}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:18px 0}.stat{padding:10px 5px;border:1px solid var(--l);border-radius:13px;text-align:center}.stat b{display:block;color:var(--g);font-size:18px}.stat small{color:var(--m);font-size:10px}.advice{padding:13px;border:1px solid #81e4bc40;border-radius:14px;color:#d8f9eb;background:#478e791f;font-size:13px}.source{color:var(--m);font-size:11px;margin-top:18px}.source a{color:var(--b)}@media(max-width:760px){main{width:min(100% - 20px,580px)}.layout{grid-template-columns:1fr}.stats{gap:4px}.panel{border-radius:19px}}
+</style></head><body><main><header><div><strong>FF14 QUICK TOOL</strong><b>天書奇談預測器</b></div><a class="back" href="ffxiv-tools.html">← 工具首頁</a></header><div class="hero"><h1>先看機率，再決定怎麼放。</h1>點選已放置的印記，系統會將剩餘印記平均放入未標記格，計算完成 0～3 線的機率。</div><div class="layout"><section class="panel"><h2>標記已放置的印記</h2><p class="help">已放置：<b id="count">0 / 9</b>，再點一次可取消。</p><div class="gridbox"><div class="grid" id="grid"></div></div><div class="bar"><span>4×4 盤面</span><b id="left">還需 9 個</b></div><div class="actions"><button class="btn main" id="reset">清除重來</button><button class="btn" id="undo">復原</button></div></section><aside class="panel"><h2>連線機率預測</h2><p class="help">橫線、直線、對角線共 10 條。</p><div class="stats"><div class="stat"><b id="p0">—</b><small>0 線</small></div><div class="stat"><b id="p1">—</b><small>1 線</small></div><div class="stat"><b id="p2">—</b><small>2 線</small></div><div class="stat"><b id="p3">—</b><small>3 線</small></div></div><div class="advice" id="advice">請先點選已放置的印記。</div><p class="source">參考 <a href="https://ff14.tw/tools/wondrous-tails/index.html" target="_blank">ff14.tw 天書奇談預測器</a>。</p></aside></div></main><script>var total=9,board=Array(16).fill(0),hist=[];var grid=document.getElementById("grid");function save(){hist.push(board.slice())}function choose(a,k,s,r,o){if(!o)o=[];if(k===0){o.push(r.slice());return o}for(var i=s;i<=a.length-k;i++)choose(a,k-1,i+1,r.concat(a[i]),o);return o}function lines(m){var n=0;for(var r=0;r<4;r++)if([0,1,2,3].every(function(c){return m[r*4+c]}))n++;for(var c=0;c<4;c++)if([0,1,2,3].every(function(r){return m[r*4+c]}))n++;if([0,5,10,15].every(function(i){return m[i]}))n++;if([3,6,9,12].every(function(i){return m[i]}))n++;return n}function pct(n,d){return d?(n/d*100).toFixed(1)+"%":"—"}function draw(){grid.innerHTML="";board.forEach(function(v,i){var b=document.createElement("button");b.className="cell"+(v?" on":"");b.innerHTML=(v?"✦":"·")+"<small>"+(i+1)+"</small>";b.onclick=function(){if(!v&&board.filter(Boolean).length===9)return;save();board[i]=!board[i];draw();calc()};grid.appendChild(b)});var n=board.filter(Boolean).length;document.getElementById("count").textContent=n+" / 9";document.getElementById("left").textContent=n===9?"已放置完成":"還需 "+(9-n)+" 個";document.getElementById("undo").disabled=!hist.length}function calc(){var k=board.filter(Boolean).length,need=9-k,unknown=board.map(function(v,i){return v?-1:i}).filter(function(i){return i>=0}),d=[0,0,0,0],sets=choose(unknown,need,0,[]);sets.forEach(function(extra){var m=board.slice();extra.forEach(function(i){m[i]=1});d[Math.min(3,lines(m))]++});[0,1,2,3].forEach(function(i){document.getElementById("p"+i).textContent=pct(d[i],sets.length)});document.getElementById("advice").textContent=k?"三線機率 "+pct(d[3],sets.length)+"；至少一線 "+pct(sets.length-d[0],sets.length)+"。":"請先點選已放置的印記。"}document.getElementById("reset").onclick=function(){if(board.some(Boolean)){save();board=Array(16).fill(0);draw();calc()}};document.getElementById("undo").onclick=function(){if(hist.length){board=hist.pop();draw();calc()}};draw();calc();</script></body></html>
