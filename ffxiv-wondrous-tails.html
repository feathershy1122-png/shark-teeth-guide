<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#15132c">
  <title>天書奇談預測器｜FF14 工具箱</title>
  <style>
    :root{color-scheme:dark;--bg:#100e22;--panel:rgba(32,27,63,.92);--line:rgba(224,188,255,.18);--text:#fff9ff;--muted:#b9accb;--gold:#ffd36f;--pink:#ff8bd4;--blue:#82d9ff;--green:#81e4bc;--red:#ff9c9c;--shadow:0 24px 80px rgba(0,0,0,.3)}
    *{box-sizing:border-box}body{margin:0;min-width:320px;color:var(--text);font-family:"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.5;background:radial-gradient(circle at 8% 2%,rgba(161,86,196,.28),transparent 29%),radial-gradient(circle at 94% 12%,rgba(55,123,194,.2),transparent 27%),linear-gradient(160deg,#100e22,#171536 58%,#0e0c1e)}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.25;background-image:radial-gradient(rgba(255,211,111,.28) 1px,transparent 1px);background-size:28px 28px;mask-image:linear-gradient(to bottom,#000,transparent 72%)}button{font:inherit}.page{position:relative;width:min(1080px,calc(100% - 32px));margin:auto;padding:24px 0 50px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{display:flex;gap:12px;align-items:center}.mark{display:grid;place-items:center;width:42px;height:42px;border:1px solid rgba(255,211,111,.54);border-radius:14px;color:var(--gold);background:rgba(122,75,126,.3);font-size:22px}.brand small{display:block;color:var(--gold);font-size:10px;letter-spacing:.16em;font-weight:700}.brand strong{display:block;font-size:15px}.back{color:var(--blue);font-size:13px;text-decoration:none}.hero{margin-bottom:22px}.eyebrow{margin:0 0 7px;color:var(--gold);font-size:11px;letter-spacing:.14em;font-weight:700}h1{margin:0 0 9px;font-size:clamp(30px,6vw,50px);line-height:1.08;letter-spacing:-.04em}.hero p{max-width:700px;margin:0;color:var(--muted);font-size:14px}.layout{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(300px,.95fr);gap:18px;align-items:start}.panel{padding:clamp(18px,4vw,28px);border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,rgba(40,32,77,.92),rgba(21,19,49,.9));box-shadow:var(--shadow)}.result{position:sticky;top:16px}h2{margin:0 0 7px;font-size:21px}.helper{margin:0 0 18px;color:var(--muted);font-size:13px}.grid-wrap{padding:13px;border:1px solid rgba(255,211,111,.2);border-radius:20px;background:rgba(10,8,27,.35)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:500px;margin:auto;aspect-ratio:1}.cell{border:1px solid rgba(224,188,255,.22);border-radius:13px;color:rgba(255,249,255,.5);background:linear-gradient(145deg,rgba(68,52,111,.76),rgba(33,28,68,.8));cursor:pointer;transition:.18s}.cell:hover{transform:translateY(-2px);border-color:var(--gold)}.cell.filled{border-color:var(--pink);color:#fff;background:linear-gradient(145deg,rgba(155,76,139,.88),rgba(68,39,93,.9));box-shadow:0 0 0 2px rgba(255,139,212,.15)}.cell:focus-visible,.action:focus-visible{outline:3px solid rgba(255,211,111,.86);outline-offset:2px}.cell span{display:block;font-size:clamp(22px,5vw,38px);font-weight:800;line-height:1}.cell small{display:block;margin-top:5px;font-size:10px;color:inherit}.bar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:15px 0 0;color:var(--muted);font-size:13px}.bar strong{color:var(--gold);font-size:18px}.actions{display:flex;gap:8px;margin-top:15px}.action{min-height:40px;padding:0 13px;border:1px solid var(--line);border-radius:12px;color:var(--text);background:rgba(255,255,255,.05);cursor:pointer}.action.primary{border:0;color:#201531;background:linear-gradient(135deg,#ffd36f,#ff9cd9);font-weight:800}.action:disabled{opacity:.45;cursor:not-allowed}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}.stat{padding:12px 7px;border:1px solid var(--line);border-radius:15px;text-align:center;background:rgba(255,255,255,.04)}.stat strong{display:block;color:var(--gold);font-size:20px}.stat span{color:var(--muted);font-size:11px}.advice{padding:14px 15px;border:1px solid rgba(129,228,188,.25);border-radius:16px;color:#d8f9eb;background:rgba(71,142,121,.12);font-size:13px}.formula{margin-top:16px;padding-top:15px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.formula b{color:var(--text)}.source{margin-top:18px;color:var(--muted);font-size:11px}.source a{color:var(--blue)}@media(max-width:760px){.page{width:min(100% - 22px,580px);padding-top:16px}.layout{grid-template-columns:1fr}.result{position:static}.grid{gap:6px}.panel{border-radius:20px}.stats{gap:5px}}
  </style>
</head>
<body><main class="page">
  <header class="topbar"><div class="brand"><div class="mark">✦</div><div><small>FF14 QUICK TOOL</small><strong>天書奇談預測器</strong></div></div><a class="back" href="ffxiv-tools.html">← 工具首頁</a></header>
  <section class="hero"><p class="eyebrow">WONDROUS TAILS</p><h1>先看機率，再決定怎麼放。</h1><p>點選目前已經放置的印記；系統會把剩下的印記等機率放入未標記格，列出完成 1、2、3 線的精確組合機率。</p></section>
  <div class="layout"><section class="panel"><h2>標記已放置的印記</h2><p class="helper">目前已放置：<strong id="placedLabel">0 / 9</strong>。再點一次可取消。</p><div class="grid-wrap"><div class="grid" id="grid"></div></div><div class="bar"><span>點格子＝標記印記</span><strong id="remainingLabel">還需放置 9 個</strong></div><div class="actions"><button class="action primary" id="resetBtn">清除重來</button><button class="action" id="undoBtn">復原</button><button class="action" id="redoBtn">重做</button></div></section>
    <aside class="panel result"><h2>連線機率預測</h2><p class="helper">以剩餘印記平均分布於未標記格計算。</p><div class="stats"><div class="stat"><strong id="p0">—</strong><span>0 線</span></div><div class="stat"><strong id="p1">—</strong><span>1 線</span></div><div class="stat"><strong id="p2">—</strong><span>2 線</span></div><div class="stat"><strong id="p3">—</strong><span>3 線</span></div></div><div class="advice" id="advice">請先點選已放置的印記。</div><div class="formula"><b>計算方式</b><br>從所有可能的剩餘印記位置中逐盤檢查 4×4 的橫線、直線與對角線，共 10 條線。</div><p class="source">玩法介面參考 <a href="https://ff14.tw/tools/wondrous-tails/index.html" target="_blank" rel="noreferrer">ff14.tw 天書奇談預測器</a>。</p></aside>
  </div>
</main>
<script>
  const TOTAL=9, size=16; let board=Array(size).fill(false), undo=[], redo=[];
  const grid=document.getElementById('grid');
  function snapshot(){return board.slice()}
  function remember(){undo.push(snapshot());if(undo.length>40)undo.shift();redo=[]}
  function render(){grid.innerHTML='';board.forEach((filled,i)=>{const b=document.createElement('button');b.className='cell'+(filled?' filled':'');b.type='button';b.setAttribute('aria-label',`第 ${i+1} 格${filled?' 已放置':' 未放置'}`);b.innerHTML=`<span>${filled?'✦':'·'}</span><small>${i+1}</small>`;b.onclick=()=>{if(!filled&&board.filter(Boolean).length>=TOTAL)return;remember();board[i]=!board[i];render();calculate()};grid.appendChild(b)});const count=board.filter(Boolean).length;document.getElementById('placedLabel').textContent=`${count} / ${TOTAL}`;document.getElementById('remainingLabel').textContent=count===TOTAL?'已放置完成':`還需放置 ${TOTAL-count} 個`;document.getElementById('undoBtn').disabled=!undo.length;document.getElementById('redoBtn').disabled=!redo.length}
  function choose(arr,k,start=0,prefix=[],out=[]){if(k===0){out.push(prefix.slice());return out}for(let i=start;i<=arr.length-k;i++)choose(arr,k-1,i+1,prefix.concat(arr[i]),out);return out}
  function lineCount(mask){let lines=0;for(let r=0;r<4;r++)if([0,1,2,3].every(c=>mask[r*4+c]))lines++;for(let c=0;c<4;c++)if([0,1,2,3].every(r=>mask[r*4+c]))lines++;if([0,5,10,15].every(i=>mask[i]))lines++;if([3,6,9,12].every(i=>mask[i]))lines++;return lines}
  function percent(n,d){return d?`${(n/d*100).toFixed(1)}%`:'—'}
  function calculate(){const known=board.filter(Boolean).length, need=TOTAL-known, unknown=board.map((v,i)=>v?null:i).filter(v=>v!==null), dist=[0,0,0,0];if(need<0){document.getElementById('advice').textContent='已超過 9 個印記，請取消多餘格子。';return}const combos=choose(unknown,need);if(!combos.length&&need!==0)return;combos.forEach(extra=>{const m=board.slice();extra.forEach(i=>m[i]=true);dist[Math.min(3,lineCount(m))]++});const den=combos.length;[0,1,2,3].forEach(i=>document.getElementById('p'+i).textContent=percent(dist[i],den));let msg=known?`目前三線機率 ${percent(dist[3],den)}，至少一線 ${percent(den-dist[0],den)}。`:'請先點選已放置的印記。';if(known===TOTAL)msg=`已放置 9 個印記：這局為 ${lineCount(board)} 線。`;document.getElementById('advice').textContent=msg}
  document.getElementById('resetBtn').onclick=()=>{if(board.some(Boolean)){remember();board=Array(size).fill(false);render();calculate()}};document.getElementById('undoBtn').onclick=()=>{if(!undo.length)return;redo.push(snapshot());board=undo.pop();render();calculate()};document.getElementById('redoBtn').onclick=()=>{if(!redo.length)return;undo.push(snapshot());board=redo.pop();render();calculate()};render();calculate();
</script></body></html>
