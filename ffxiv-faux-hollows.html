<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>幻巧拼圖預測｜FF14 工具箱</title><style>:root{color-scheme:dark;--t:#fff9ff;--m:#b9accb;--g:#ffd36f;--b:#82d9ff;--p:#211b43;--l:#e0bcff2e}*{box-sizing:border-box}body{margin:0;min-width:320px;color:var(--t);font:15px/1.55 Segoe UI,"Noto Sans TC",sans-serif;background:radial-gradient(circle at 8% 2%,#a156c44a,transparent 30%),linear-gradient(160deg,#100e22,#171536 60%,#0e0c1e)}main{width:min(1000px,calc(100% - 24px));margin:auto;padding:22px 0 50px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}header strong{display:block;color:var(--g);font-size:12px;letter-spacing:.13em}header b{font-size:16px}.back,a{color:var(--b);text-decoration:none;font-size:13px}h1{font-size:clamp(30px,6vw,52px);line-height:1.1;margin:0 0 8px}.hero{color:var(--m);margin-bottom:22px}.layout{display:grid;grid-template-columns:1fr 340px;gap:18px}.panel{padding:clamp(18px,4vw,28px);border:1px solid var(--l);border-radius:22px;background:linear-gradient(145deg,#28204deb,#151331e6);box-shadow:0 24px 80px #0005}.tools{display:flex;align-items:center;gap:8px;margin:14px 0}.tools label,.help{color:var(--m);font-size:13px}.select{padding:9px;border:1px solid var(--l);border-radius:10px;color:var(--t);background:#211c45}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;padding:12px;border:1px solid #ffd36f33;border-radius:18px;background:#0a081b59}.cell{aspect-ratio:1;border:1px solid #e0bcff38;border-radius:7px;color:#fff9ff77;background:#44346fc2;cursor:pointer;font-size:clamp(16px,4vw,27px);font-weight:800}.cell.block{color:#ffcaca;border-color:#ff9c9c;background:#87364fb3}.cell.open{color:var(--b);border-color:#82d9ff99;background:#275577a6}.cell.sword{color:var(--g);border-color:#ffd36f;background:#8e6030b8}.cell.box{color:#81e4bc;border-color:#81e4bc;background:#2f775cb0}.cell.fox{color:#ff8bd4;border-color:#ff8bd4;background:#8b3d76b3}.cell.rec{box-shadow:0 0 0 2px #82d9ff99}.legend{color:var(--m);font-size:11px;margin-top:12px}.bar{display:flex;justify-content:space-between;margin-top:14px;color:var(--m)}.bar b{color:var(--g);font-size:18px}.btn{margin-top:14px;min-height:40px;padding:0 14px;border:1px solid var(--l);border-radius:11px;color:var(--t);background:#ffffff0d;cursor:pointer}.btn.main{border:0;color:#201531;background:linear-gradient(135deg,#ffd36f,#ff9cd9);font-weight:800}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}.stat{padding:12px;border:1px solid var(--l);border-radius:13px}.stat b{display:block;color:var(--g);font-size:20px}.stat small{color:var(--m);font-size:11px}.advice{padding:13px;border:1px solid #81e4bc40;border-radius:14px;color:#d8f9eb;background:#478e791f;font-size:13px}.note{margin-top:15px;color:#f8e7ba;border:1px solid #ffd36f38;border-radius:13px;padding:12px;background:#8e60301f;font-size:12px}.source{color:var(--m);font-size:11px;margin-top:18px}@media(max-width:760px){main{width:min(100% - 20px,580px)}.layout{grid-template-columns:1fr}.panel{border-radius:19px}}
+</style></head><body><main><header><div><strong>FF14 QUICK TOOL</strong><b>幻巧拼圖預測</b></div><a class="back" href="ffxiv-tools.html">← 工具首頁</a></header><div class="hero"><h1>記錄盤面，少走一步冤枉路。</h1>6×6 盤面、5 個障礙物、最多 11 次翻牌。藍框是中心優先的下一個建議位置。</div><div class="layout"><section class="panel"><h2>盤面記錄</h2><div class="tools"><label>標記：</label><select id="mode" class="select"><option value="block">障礙物</option><option value="open">空白／已翻開</option><option value="sword">劍</option><option value="box">寶箱</option><option value="fox">狐</option></select></div><div class="grid" id="grid"></div><div class="legend">× 障礙物　○ 空白　⚔ 劍　▣ 寶箱　🦊 狐　／藍框：建議候選</div><div class="bar"><span>已翻牌</span><b><span id="moves">0</span> / 11</b></div><button class="btn main" id="reset">清除重來</button></section><aside class="panel"><h2>目前判讀</h2><div class="stats"><div class="stat"><b id="bc">0 / 5</b><small>已知障礙物</small></div><div class="stat"><b id="oc">0</b><small>已記錄翻牌</small></div><div class="stat"><b id="uc">36</b><small>未標記格</small></div><div class="stat"><b id="rc">3</b><small>推薦候選</small></div></div><div class="advice" id="advice">先標記兩個已知障礙物，或記錄已翻出的格子。</div><div class="note">這是手機友善的盤面記錄／簡化資訊增益版；完整 252 種盤面 solver 可由下方連結開啟。</div><p class="source"><a href="https://faux.joshuaen.com/" target="_blank">完整 Faux Hollows Solver ↗</a><br><a href="https://ff14.tw/tools/faux-hollows-foxes/index.html" target="_blank">參考 ff14.tw 版本 ↗</a></p></aside></div></main><script>var a=Array(36).fill(""),h=[];var grid=document.getElementById("grid"),labels={block:"×",open:"○",sword:"⚔",box:"▣",fox:"🦊"};function near(i){var r=Math.floor(i/6),c=i%6,n=[];for(var dr=-1;dr<=1;dr++)for(var dc=-1;dc<=1;dc++){var R=r+dr,C=c+dc;if((dr||dc)&&R>=0&&R<6&&C>=0&&C<6)n.push(R*6+C)}return n}function rec(){return a.map(function(v,i){return{v:v,i:i,s:v?99:Math.abs(2.5-Math.floor(i/6))+Math.abs(2.5-i%6)}}).filter(function(x){return !x.v}).sort(function(x,y){return x.s-y.s}).slice(0,3).map(function(x){return x.i})}function draw(){var rr=rec();grid.innerHTML="";a.forEach(function(v,i){var b=document.createElement("button");b.className="cell "+v+(rr.indexOf(i)>=0?" rec":"");b.textContent=v?labels[v]:"·";b.onclick=function(){h.push(a.slice());var m=document.getElementById("mode").value;a[i]=a[i]===m?"":m;draw()};grid.appendChild(b)});var blocked=a.filter(function(v){return v==="block"}).length,opened=a.filter(function(v){return ["open","sword","box","fox"].indexOf(v)>=0}).length;document.getElementById("bc").textContent=blocked+" / 5";document.getElementById("oc").textContent=opened;document.getElementById("uc").textContent=a.filter(function(v){return !v}).length;document.getElementById("rc").textContent=rr.length;document.getElementById("moves").textContent=opened;document.getElementById("advice").textContent=blocked>=5?"5 個障礙物已記錄；接著補記劍、寶箱與狐。":"下一步可優先嘗試第 "+rr.map(function(i){return i+1}).join("、")+" 格（藍框）。"}document.getElementById("reset").onclick=function(){h.push(a.slice());a=Array(36).fill("");draw()};draw();</script></body></html>
